<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ERP System</title>
    <script>
      (function () {
        try {
          var locale = localStorage.getItem("hr_locale");
          var theme = localStorage.getItem("hr_theme");
          var root = document.documentElement;
          root.lang = locale === "en" ? "en" : "ar";
          root.dir = locale === "en" ? "ltr" : "rtl";
          if (theme === "dark") root.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
