[build]
  command = "npm run build"
  publish = "dist"

# Proxy API to backend server (http — backend TLS is unreliable)
[[redirects]]
  from = "/api/*"
  to = "http://mag-erp-system.runasp.net/api/:splat"
  status = 200
  force = true

# Proxy uploaded media (avatars, ID cards) through same origin
[[redirects]]
  from = "/media/*"
  to = "http://mag-erp-system.runasp.net/:splat"
  status = 200
  force = true

# React Router — client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
